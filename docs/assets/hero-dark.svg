<title id="t">mod-builder: Mod Lab docked beside a Claude Code transcript, mid-build.</title>
<desc id="d">Describe a Claude Code mod in one sentence. Approve one spec. Get a tested, documented mod. A Claude Code window shows the prompt /mod-builder:build a band above the prompt showing the git branch, with Mod Lab beside it: four mods (aurora, git-branch, issue-forge, turn-counter) with stage lights, the demo mod aurora on the Register stage, its progress band and git-branch's band above the prompt, and the status line reading 4 mods, 1 building.</desc>
