<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="345" viewBox="0 0 1200 345" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve" style="white-space:pre" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="title">How /mod-builder:build works: request, then Interview, then the SPEC.md approval gate, then Scaffold, Build, Verify and Ship, then handoff.</title>
<rect width="1200" height="345" rx="16" fill="#1A1918"></rect><text x="40" y="52" fill="#8A8580" font-size="11" letter-spacing="2">REQUEST</text>
<text x="40" y="80" fill="#D97757" font-size="16">/mod-builder:build &lt;idea&gt;</text>
<line x1="126" y1="92" x2="126" y2="121" stroke="#8A8580" stroke-width="1.5"></line><path d="M126 127L122.4 121L129.6 121Z" fill="#8A8580"></path><text x="316" y="118" fill="#D97757" font-size="11" text-anchor="middle" letter-spacing="2">APPROVAL GATE</text>
<rect x="40.5" y="130.5" width="171" height="159" rx="10" fill="#222020" stroke="#36322F" stroke-width="1"></rect><text x="56" y="162" fill="#8A8580" font-size="11" letter-spacing="2">STEP 1</text>
<text x="56" y="190" fill="#E8E6E3" font-size="18" font-weight="700">Interview</text>
<text x="56" y="222" fill="#8A8580" font-size="14">asks only what</text>
<text x="56" y="242" fill="#8A8580" font-size="14">the request</text>
<text x="56" y="262" fill="#8A8580" font-size="14">leaves open</text>
<line x1="214" y1="185" x2="222" y2="185" stroke="#8A8580" stroke-width="1.5"></line><path d="M228 185L222 181.4L222 188.6Z" fill="#8A8580"></path><rect x="230.5" y="130.5" width="171" height="159" rx="10" fill="#222020" stroke="#D97757" stroke-width="2"></rect><text x="246" y="162" fill="#D97757" font-size="11" letter-spacing="2">GATE</text>
<text x="246" y="190" fill="#E8E6E3" font-size="18" font-weight="700">SPEC.md</text>
<text x="246" y="222" fill="#8A8580" font-size="14">every file,</text>
<text x="246" y="242" fill="#8A8580" font-size="14">process and cost</text>
<text x="246" y="262" fill="#D97757" font-size="14">you approve once</text>
<line x1="404" y1="185" x2="412" y2="185" stroke="#D97757" stroke-width="1.5"></line><path d="M418 185L412 181.4L412 188.6Z" fill="#D97757"></path><rect x="420.5" y="130.5" width="171" height="159" rx="10" fill="#222020" stroke="#36322F" stroke-width="1"></rect><text x="436" y="162" fill="#8A8580" font-size="11" letter-spacing="2">STEP 2</text>
<text x="436" y="190" fill="#E8E6E3" font-size="18" font-weight="700">Scaffold</text>
<text x="436" y="222" fill="#8A8580" font-size="14">from 1 of 5</text>
<text x="436" y="242" fill="#8A8580" font-size="14">tested archetypes</text>
<line x1="594" y1="185" x2="602" y2="185" stroke="#8A8580" stroke-width="1.5"></line><path d="M608 185L602 181.4L602 188.6Z" fill="#8A8580"></path><rect x="610.5" y="130.5" width="171" height="159" rx="10" fill="#222020" stroke="#36322F" stroke-width="1"></rect><text x="626" y="162" fill="#8A8580" font-size="11" letter-spacing="2">STEP 3</text>
<text x="626" y="190" fill="#E8E6E3" font-size="18" font-weight="700">Build</text>
<text x="626" y="222" fill="#8A8580" font-size="14">pure logic and</text>
<text x="626" y="242" fill="#8A8580" font-size="14">unit tests, then</text>
<text x="626" y="262" fill="#8A8580" font-size="14">thin register.tsx</text>
<line x1="784" y1="185" x2="792" y2="185" stroke="#8A8580" stroke-width="1.5"></line><path d="M798 185L792 181.4L792 188.6Z" fill="#8A8580"></path><rect x="800.5" y="130.5" width="171" height="159" rx="10" fill="#222020" stroke="#36322F" stroke-width="1"></rect><text x="816" y="162" fill="#8A8580" font-size="11" letter-spacing="2">STEP 4</text>
<text x="816" y="190" fill="#E8E6E3" font-size="18" font-weight="700">Verify</text>
<text x="816" y="222" fill="#8A8580" font-size="14">plugin validate</text>
<text x="816" y="242" fill="#8A8580" font-size="14">plugin test</text>
<text x="816" y="262" fill="#8A8580" font-size="14">tsc · smoke test</text>
<line x1="974" y1="185" x2="982" y2="185" stroke="#8A8580" stroke-width="1.5"></line><path d="M988 185L982 181.4L982 188.6Z" fill="#8A8580"></path><rect x="990.5" y="130.5" width="171" height="159" rx="10" fill="#222020" stroke="#36322F" stroke-width="1"></rect><text x="1006" y="162" fill="#8A8580" font-size="11" letter-spacing="2">STEP 5</text>
<text x="1006" y="190" fill="#E8E6E3" font-size="18" font-weight="700">Ship</text>
<text x="1006" y="222" fill="#8A8580" font-size="14">README with</text>
<text x="1006" y="242" fill="#8A8580" font-size="14">What it reaches,</text>
<text x="1006" y="262" fill="#8A8580" font-size="14">marketplace entry</text>
<line x1="1076" y1="292" x2="1076" y2="300" stroke="#8A8580" stroke-width="1.5"></line><path d="M1076 306L1072.4 300L1079.6 300Z" fill="#8A8580"></path><text x="1076" y="326" fill="#D97757" font-size="12" text-anchor="middle" letter-spacing="2">HANDOFF</text>
</svg>