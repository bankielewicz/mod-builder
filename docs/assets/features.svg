<title id="t">What mod-builder gives you</title>
<desc id="d">One approval: Claude asks only what's missing, then you approve one SPEC. Works first time: 5 tested starting points, logic with unit tests. Live pipeline: 8 stages, re-checked when code changes. Honest edits: Changes show exactly what still needs redoing. Know what you install: Every mod lists what it can reach.</desc>
